    registered_name: Oneflow AB
    matched_domain: oneflow.com
    matched_by: domain
    identity_source: the listing's own companyUrl (no lookup)
    certified_products:
    - product: HubSpot Certified App
      product_type: APP
      certifier: HubSpot (App Certification)
      listings: 1
      example_listing: https://ecosystem.hubspot.com/marketplace/listing/oneflow
      lapsed: false
      lapsed_note: the certified flag is printed on a LIVE public listing card (CERTIFIED filter); HubSpot prints
        no certification date, so the badge reads as current
