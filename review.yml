sources:
  - url: https://developer.oneflow.com/docs/getting-started
    type: Documentation
    note: Base URL https://api.oneflow.com/v1, token auth, resource overview, /ping health check.
  - url: https://developer.oneflow.com/docs/authentication-and-authorization
    type: Documentation
    note: x-oneflow-api-token plus x-oneflow-user-email header auth; no rate limits mentioned.
  - url: https://developer.oneflow.com/docs/create-a-basic-contract
    type: APIReference
    note: POST /v1/contracts/create with workspace_id and template_id.
  - url: https://developer.oneflow.com/docs/publish-a-contract
    type: APIReference
    note: POST /v1/contracts/{contract_id}/publish sends the signing invitation.
  - url: https://developer.oneflow.com/reference/get-templates
    type: APIReference
    note: GET /v1/templates with offset/limit and workspace/template-type filters.
  - url: https://developer.oneflow.com/reference/get-workspaces
    type: APIReference
    note: GET /v1/workspaces with pagination and name/id filters.
  - url: https://developer.oneflow.com/docs/webhook.md
    type: Documentation
    note: Webhooks deliver contract events (EVENT_TYPE, WORKSPACE filters) to a callback URL. HTTP, not WebSocket.
  - url: https://developer.oneflow.com/llms.txt
    type: Documentation
    note: Machine-readable index listing contract, participant, party, data-field, template, user, workspace, webhook resources.
  - url: https://support.oneflow.com/support/solutions/articles/77000539022-public-api
    type: Documentation
    note: Public API help-center overview (token generation in Marketplace).
  - url: https://oneflow.com/pricing/
    type: Pricing
    note: Per-user SaaS tiers; API and webhooks gated to Business and Enterprise plans.
actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket protocol surface exists on Oneflow's own API. Oneflow's public
    surface is request/response REST (the Public API) plus outbound HTTP
    webhooks for event delivery. No AsyncAPI document was created because there
    is no server-push (WebSocket/SSE) transport on Oneflow's own API to model;
    webhooks are ordinary outbound HTTP callbacks and are represented in the
    Webhooks API entry in apis.yml.
