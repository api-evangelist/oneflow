description: >-
  FinOps view of Oneflow spend. Oneflow is a per-user SaaS subscription: cost is
  driven primarily by the number of licensed seats and the plan tier (Essentials,
  Business, Enterprise), billed annually. The Public API and webhooks do not carry
  a separate metered fee - they are entitlements unlocked by the Business and
  Enterprise plans, so API-driven automation is a fixed subscription cost rather
  than usage-metered. Secondary costs come from add-ons: premium integrations
  (Salesforce, Microsoft Dynamics) and advanced eID signature methods. The main
  FinOps levers are seat right-sizing (deactivating unused users), choosing the
  lowest tier that unlocks the needed capabilities (e.g. Business for API access),
  and controlling per-signature or per-integration add-on consumption.
notes: >-
  Per-seat rates and add-on pricing are not reconciled here; verify on the Oneflow
  pricing page and in the customer contract. Currency shown publicly is EUR;
  enterprise agreements are custom-quoted and may be in other currencies.
