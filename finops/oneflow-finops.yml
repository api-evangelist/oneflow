meters:
- name: licensed_seats
  description: Number of licensed Oneflow users per plan tier - the primary billing driver.
  unit: seats
  aggregation: sum
  dimensions:
  - account
  - plan
  - workspace
- name: eid_signatures
  description: Advanced electronic identification (eID) signature methods consumed, priced as an add-on.
  unit: signatures
  aggregation: sum
  dimensions:
  - account
  - workspace
- name: premium_integrations
  description: Premium integration add-ons (Salesforce, Microsoft Dynamics) enabled on the account.
  unit: integrations
  aggregation: sum
  dimensions:
  - account
principles:
- name: Visibility
  description: Track licensed seats per plan and workspace, plus any eID signature and premium integration add-on consumption, against the annual subscription.
- name: Allocation
  description: Map seats and workspaces to teams or cost centers so subscription cost is attributed to the business units using Oneflow.
- name: Optimization
  description: Right-size seats by deactivating unused users, pick the lowest tier that unlocks required capabilities (Business unlocks Public API and webhooks), and control add-on eID/integration usage.
- name: Accountability
  description: Assign an owner per account/workspace to review seat counts and add-on charges at renewal against actual contract volume and integration needs.
