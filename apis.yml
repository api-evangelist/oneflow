aid: oneflow
url: https://raw.githubusercontent.com/api-evangelist/oneflow/refs/heads/main/apis.yml
name: Oneflow
kind: company
description: Oneflow is a contract lifecycle management and e-signature platform that
  turns static documents into smart, data-rich digital contracts - covering creation
  from templates, negotiation, e-signing, and post-sign lifecycle management. The
  Oneflow Public API is a REST API at https://api.oneflow.com/v1 authenticated with
  an account API token (x-oneflow-api-token) plus an acting-user email header
  (x-oneflow-user-email) for permission checks. It lets teams programmatically
  create contracts from templates, add parties and participants, fill data fields
  and products, publish contracts for signing, download signed files, and subscribe
  to contract lifecycle events via webhooks. API access and webhooks are available
  on the Business and Enterprise plans.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Contract Management
- Contract Lifecycle Management
- E-Signature
- Digital Contracts
- Document Automation
- CLM
created: '2026-07-03'
modified: '2026-07-03'
specificationVersion: '0.19'
